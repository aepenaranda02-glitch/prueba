{% extends 'tickets/base.html' %}

{% block title %}Nuevo Ticket · HelpDesk{% endblock %}

{% block content %}

<div class="page-head">
    <div>
        <h1 class="page-title">Nuevo Ticket</h1>
        <p class="page-subtitle">Completa la información para registrar un nuevo ticket</p>
    </div>
    <a href="{% url 'lista_tickets' %}" class="btn btn-ghost">← Volver</a>
</div>

<form method="post" class="form-card" id="ticket-form" novalidate>
    {% csrf_token %}

    <div class="form-group">
        <label for="titulo">Título <span class="req">*</span></label>
        <input type="text" name="titulo" id="titulo" maxlength="200" required
               placeholder="Ej: Error al iniciar sesión"
               value="{{ datos.titulo|default:'' }}">
        <small class="error-text" data-error-for="titulo"></small>
    </div>

    <div class="form-group">
        <label for="categoria">Categoría <span class="req">*</span></label>
        <input type="text" name="categoria" id="categoria" maxlength="100" required
               placeholder="Ej: Software, Hardware, Red..."
               value="{{ datos.categoria|default:'' }}">
        <small class="error-text" data-error-for="categoria"></small>
    </div>

    <div class="form-group">
        <label for="prioridad">Prioridad <span class="req">*</span></label>
        <select name="prioridad" id="prioridad" required>
            <option value="">Selecciona una prioridad</option>
            {% for value, label in prioridades %}
                <option value="{{ value }}"
                    {% if datos.prioridad == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
        <small class="error-text" data-error-for="prioridad"></small>
    </div>

    <div class="form-group">
        <label for="descripcion">Descripción <span class="req">*</span></label>
        <textarea name="descripcion" id="descripcion" rows="6" required
                  placeholder="Describe el problema con el mayor detalle posible...">{{ datos.descripcion|default:'' }}</textarea>
        <small class="error-text" data-error-for="descripcion"></small>
    </div>

    <div class="form-actions">
        <a href="{% url 'lista_tickets' %}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary">Crear Ticket</button>
    </div>
</form>

{% endblock %}
